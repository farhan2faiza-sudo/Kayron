name: Build Mobile APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: unzip -q -o "$(ls -S KayronMobile*.zip | head -1)"
      - run: cd KayronMobile && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Kayron-APK
          path: KayronMobile/app/build/outputs/apk/debug/*.apk
